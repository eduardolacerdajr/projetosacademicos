server.port=${SERVER_PORT:8082}
spring.application.name=projetos-service
spring.datasource.url=${PROJETOS_DATABASE_URL:jdbc:sqlite:projetos.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
alunos.service.url=${ALUNOS_SERVICE_URL:http://localhost:8083}
professores.service.url=${PROFESSORES_SERVICE_URL:http://localhost:8084}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
